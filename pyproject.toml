[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hakedis"
version = "0.1.0"
description = "Kalip plani (DWG/DXF/PDF) uzerinden eleman bazli kirik olcu metraji ureten acik kaynak sistem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ezdxf>=1.3",
    "shapely>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.27"]
# Gorsel arayuz: web sunucusu ve masaustu penceresi
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pywebview>=5.0",
]
# Tarayici (Playwright) uc tan uca testleri
e2e = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
]

[project.scripts]
hakedis = "hakedis.cli:main"

[tool.setuptools.packages.find]
include = ["hakedis*"]

[tool.setuptools.package-data]
hakedis = ["data/*.yml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: Playwright tarayici testleri (tests/e2e)",
]
filterwarnings = [
    # ezdxf'in eski numpy kullanimi (harici bagimlilik) - kendi kodumuz degil
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:ezdxf",
    # starlette test client'in httpx2 onerisi (UserWarning alt sinifi, harici bagimlilik)
    "ignore::UserWarning:fastapi.testclient",
    # Playwright istemcisinin HTTPX uyarisi (harici bagimlilik)
    "ignore::UserWarning:playwright",
]
