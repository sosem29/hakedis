[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hakedis"
version = "0.1.0"
description = "Kalip plani (DWG/DXF/PDF) uzerinden eleman bazli kirik olcu metraji ureten acik kaynak sistem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ezdxf>=1.3",
    "shapely>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
hakedis = "hakedis.cli:main"

[tool.setuptools.packages.find]
include = ["hakedis*"]

[tool.setuptools.package-data]
hakedis = ["data/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
