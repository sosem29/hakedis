# hakedis varsayilan yapilandirmasi
#
# Bu dosyayi kopyalayip kendi ofis standardiniza gore duzenleyin:
#   hakedis config-yaz --cikti ofis.yml
#   hakedis metraj plan.dxf --config ofis.yml
#
# Katman esleme desenleri REGEX'tir ve buyuk/kucuk harf duyarsizdir.
# Turkce karakterli katman adlari icin hem "İ/I" hem "S/Ş" varyantlari yazilmistir.

# --- Cizim birimi ------------------------------------------------------------
# DXF basliginda $INSUNITS tanimliysa o kullanilir. Tanimsizsa veya
# --birim ile ezilirse buradaki deger gecerlidir.
birim: cm            # mm | cm | m

# --- DXF/DWG dogrulama -------------------------------------------------------
# DXF/DWG'ten okunan geometri iki eksende de bu degerden (m) kucukse dosya
# kirpilmis/bozuk sayilir ve hata verilir. 0 verilirse kontrol kapali.
dxf:
  min_plan_boyutu: 1.0

# --- Kat bilgileri -----------------------------------------------------------
kat:
  ad: "Normal Kat"
  # Kat yuksekligi (dosemenin ust kotundan bir ust dosemenin ust kotuna), m
  kat_yuksekligi: 3.00
  # Varsayilan doseme kalinligi (etiketten okunamazsa), m
  doseme_kalinligi: 0.15
  # Varsayilan kiris kesiti (etiketten okunamazsa), m
  kiris_genisligi: 0.25
  kiris_yuksekligi: 0.50
  # Varsayilan perde kalinligi (geometriden okunamazsa), m
  perde_kalinligi: 0.25
  # Betonarme sinifi (maliyette beton pozlarina uygulanir). Girilecek degerler
  # maliyet.beton_siniflari altinda tanimli olmalidir.
  beton_sinifi: "C25/30"

# --- Merdiven ----------------------------------------------------------------
# Merdiven metraji plan izdusumunden alinir; egim katsayisi istenirse burada
# rıht/basamak verin. k = sqrt(1 + (rıht/basamak)^2) uygulanir. Sahanliklar da
# dahil oldugu icin sonuc yaklasiktir; cikti dusuk guvenle isaretlenir.
merdiven:
  # Rıht yuksekligi (m). 0 verilirse egim katsayisi uygulanmaz.
  riht: 0.175
  # Basamak genisligi (m). 0 ise katsayi hesaplanamaz.
  basamak: 0.28
  # Dogrudan egim katsayisi vermek isterseniz (hesaplananin uzerine biner):
  #   egim_katsayisi: 1.18
  egim_katsayisi: 0
  # Merdiven plak/basamak kalinligi (etiketten okunamazsa), m
  kalinlik: 0.14

# --- Katman esleme -----------------------------------------------------------
katmanlar:
  kolon:
    - '^(A-)?KOLON'
    - '^S-?KOLON'
    - '^KOL$'
    - '^COLUMN'
    - '^K[-_]?KOLON'
  perde:
    - '^PERDE'
    - '^P-?PERDE'
    - '^SHEARWALL'
    - '^WALL[-_]?RC'
  kiris:
    - '^KIRIS'
    - '^KİRİŞ'
    - '^KIRIŞ'
    - '^KİRIS'
    - '^BEAM'
    - '^K-?KIRIS'
  doseme:
    - '^DOSEME'
    - '^DÖŞEME'
    - '^DOSEME[-_]?SINIR'
    - '^SLAB'
    - '^PLAK'
  bosluk:
    - 'BOSLUK'
    - 'BOŞLUK'
    - 'OPENING'
    - 'SAFT'
    - 'ŞAFT'
    - 'ASANSOR'
    - 'ASANSÖR'
  duvar:
    - '^DUVAR'
    - '^DIVAR'
    - '^WALL'
    - '^BRICK'
    - '^TUGLA'
    - '^TUĞLA'
  merdiven:
    - '^MERDIVEN'
    - '^MERDİVEN'
    - '^STAIR'
  metin:
    - '^(TEXT|YAZI|METIN|METİN|ETIKET|ETİKET)'
    - 'ISIM'
    - 'İSİM'
    - '^S-?TEXT'
  # Metraja hic girmeyecek katmanlar (aks, olculendirme, tarama vs.)
  yoksay:
    - '^AKS'
    - '^OLCU'
    - '^ÖLÇÜ'
    - '^DIM'
    - '^TARAMA'
    - '^HATCH'
    - '^ANTET'
    - '^CERCEVE'
    - '^ÇERÇEVE'
    - '^DEFPOINTS$'
    - '^MIMARI'
    - '^MİMARİ'
    - '^KOTA'
    - '^DONATI'
  # Kesin esleme: katman adi birebir tip ile baglanir (desenlerden once
  # denenir). Arayuzdeki "Eslestirme" sekmesi burayi otomatik doldurur.
  # Bicim: katman_adi: tip  (tip: kolon|perde|kiris|doseme|merdiven|bosluk|yoksay)
  # kesin:
  #   "S-KOLON-202": kolon
  #   "AKS-1": yoksay

# --- Geometrik sezgiseller ---------------------------------------------------
# Katman adlari guvenilmezse (ozellikle PDF'te) eleman tipini bicimden tahmin et
sezgisel:
  aktif: true
  # Kapali poligonun narinligi (uzun kenar / kisa kenar) bu esigi asarsa
  # kolon degil perde sayilir.
  perde_narinlik_esigi: 4.0
  # Kolon kesiti icin gecerli kenar araligi (m)
  kolon_min_kenar: 0.20
  kolon_max_kenar: 2.00
  # Perde kalinligi araligi (m)
  perde_min_kalinlik: 0.15
  perde_max_kalinlik: 1.00
  # Kiris genisligi araligi (m) - paralel cizgi eslemede kullanilir
  kiris_min_genislik: 0.15
  kiris_max_genislik: 1.00
  kiris_min_uzunluk: 0.50
  # Doseme sayilabilmesi icin en kucuk alan (m2)
  doseme_min_alan: 1.00
  # Bu alanin altindaki kapali poligonlar gurultu sayilir (m2)
  min_poligon_alani: 0.02

# --- Etiket (yazi) okuma -----------------------------------------------------
etiket:
  # Yaziyi elemana baglarken aranacak azami uzaklik (m).
  # Yazi elemanin icindeyse mesafeye bakilmaz.
  arama_yaricapi: 1.50
  # "K101 25/50" gibi kesit yazan etiketlerdeki olcu birimi
  kesit_birimi: cm
  # Ozel desenler (regex). Adlandirilmis gruplar: ad, b, h, t
  desenler:
    kesit:
      - '(?P<ad>[A-ZÇĞİÖŞÜ]{1,3}[-_ ]?\d{1,4}[A-Za-z]?)\s*[\(\[]?\s*(?P<b>\d{1,3}(?:[.,]\d+)?)\s*[\/xX\*]\s*(?P<h>\d{1,3}(?:[.,]\d+)?)'
    kalinlik:
      - '(?:TD|KAL|T|H)\s*[=:]\s*(?P<t>\d{1,3}(?:[.,]\d+)?)'
      # "P1 25", "P12 (30)" -> perde adi + kalinligi
      # "P1 25", "P12 (30)" -> perde adi + kalinligi. Kalinlik ayirici
      # (bosluk/parantez) ZORUNLUDUR; yoksa "D101" icinde D10+1 geri sarmali
      # yanlis t=0.01 uretilir.
      - '^(?P<ad>[PD][-_ ]?\d{1,3}[A-Za-z]?)(?:\s+|\s*\(\s*|\s*\[\s*)(?P<t>\d{1,3}(?:[.,]\d+)?)\s*[\)\]]?$'
      # Doseme etiketi sonrasinda AYRI yazilmis kalinlik: "D101 20cm", "D12 (15)".
      # Boşluk/parantez zorunludur; aksi halde "5 D101" gibi metinlerde D10+1
      # geri sarmali yanlis t=0.01 uretiliyor.
      - '(?P<ad>D[-_ ]?\d{1,4})(?:\s+|\s*\(\s*)(?P<t>\d{1,3}(?:[.,]\d+)?)\s*\)?'
    ad:
      - '^(?P<ad>[SKPD][-_ ]?\d{1,4}[A-Za-z]?)$'
    # Kapi/pencere (dograma boslugu) etiketleri. Bunlar yapisal elemana
    # baglanmaz; "Kapi" / "Pencere" metraj satiri ve dograma listesi uretilir.
    # Pencere on eki P'de en az 3 hane beklenir (P101); "P12 25" gibi perde
    # etiketleriyle karismasin diye tek/kift haneli P adlari eslenmez.
    dogrular:
      - '(?i)(?P<ad>\b(?:KD|KAP)[-_ ]?\d{1,4}\b)'
      - '(?i)(?P<ad>\bP[-_ ]?\d{3,4}\b)'
      - '^\d{1,3}\s*[xX*×]\s*\d{1,3}$'

# --- Kapi / Pencere dogrulama listesi ----------------------------------------
# Kalip planindaki dogrulama etiketlerinden (KD101, P12, 90x220) dograma
# listesi cikarilir: metraj cetvelinde "adet" satiri olarak gorunur. Sadece
# on_ek ile taninan etiketler sayilir; "90x220" gibi olcu metinleri dogrulama
# deseniyle yakalanir ve kapi varsayilan (on_ek ile tip bulunamazsa PENCERE).
kapi:
  aktif: true
  # Virgul ile ayri on ekler: "KD,K" (KAP icerenler otomatik kapi sayilir)
  on_ekler: "KD"
pencere:
  aktif: true
  on_ekler: "P"

# --- Siva / Kaplama / Boya (betonarme yuzeylerinden) -------------------------
# Betonarme elemanlarin dis gorunen yuzeylerinden siva/badana (m2) ve doseme
# ustunden kaplama/tesviye (m2) yaklasik metraji uretilir. Kalip plani kot
# farklarini bilmedigi icin yalnizca YAKLASIK deger verir; cikti dusuk guvenle
# isaretlenir ve ihale oncesi fiziksel kontrol ister.
siva:
  aktif: false
  # Kolon/perde icin siva alaninin kalip alanindan dusulen kisimlari
  # (kalip iki yuz iken siva dis yuzlerdir; yuzeyler arasindaki dusum oranlari)
  yuzey_dusumu: 0.90
kaplama:
  aktif: false
  # Doseme ustu kaplama: plak izdusumu - bosluklar + iskele/saft dusumleri.
  # Tesviye + seramik/parke icin ayri pozlar uretilir.
  tesviye_poz: "23.062/T"
  seramik_poz: "23.062/S"

# --- Bolme duvari (mimari plandan) ------------------------------------------
# Yapici olmayan bolme duvarlari (tugla/bims) katman cizgilerinden (cift
# paralel cizgi) cikarilir. Kapi/pencere bosluklari duvar alanindan dusulur.
# Sadece mimari plan katmanlarinda calisir; betonarme kalip planinda yoktur.
duvar:
  aktif: false
  # Duvar yuksekligi (m). 0 verilirse net kat yuksekligi kullanilir.
  yukseklik: 0
  # Paralel cizgi eslemede gecerli duvar kalinligi araligi (m)
  min_genislik: 0.10
  max_genislik: 0.50
  # Bosluk dusumunde kapi/pencere merkezinin duvar eksenine azami uzakligi (m)
  bosluk_arama_yaricapi: 0.60
  # duvar.aktif iken siva.aktif da aciksa her iki yuz siva eklenir (2 x alan)
  siva_iki_yuz: true

# --- Doseme tipleri ----------------------------------------------------------
# Kalip planindaki doseme sirasiyla hangi sisteme ait? Bu bilgi beton
# hacmine uygulanan ek kurallari belirler. "normal" disindaki tiplerde
# ciktiya uyari dusurulur ve elle kontrol istenir.
doseme:
  tip: normal              # normal | guseli | mantar
  # Guseli/dişli doseme: dişler (nervürler) betona eklenir. Dişlerin toplam
  # kesit alaninin plan alanina orani kadar katsayi girin. Ornek: dişler
  # tabla altini %35 besliyorsa 1.35.
  guseli_hacim_katsayisi: 1.35
  # Mantar (kirissiz) doseme: kolon ustu plak (drop panel) artirimi.
  # Kolon basina artirilan hacim = mantar_kolon_baslik_alani x mantar_kolon_ustu_artisi
  mantar_kolon_ustu_artisi: 0.05    # m - plak kalinligi artisi
  mantar_kolon_baslik_alani: 1.00   # m2 - kolon ustu artis bolgesi

# --- Metraj kurallari --------------------------------------------------------
metraj:
  # Kolon/perde net yuksekligi = kat yuksekligi - doseme kalinligi
  kolon_net_yukseklik_dusumu: doseme      # doseme | kiris | yok
  # Kiris betonu: kiris yuksekliginden doseme kalinligi dusulsun mu?
  kiris_betonu_doseme_dusumu: true
  # Kiris yan kalibi: (h - doseme kalinligi) yuzeyinden hesaplanir
  kiris_yan_kalip_doseme_dusumu: true
  # Doseme kalibi dosemenin altindan alinir; kiris genislikleri dusulur mu?
  doseme_kalibindan_kiris_dus: true
  # Kolon/perde kesit alanlari da doseme kalibindan dusulsun mu?
  # (ofis pratigine gore degisir; kirislerle cakisma birlesim alinarak
  #  hesaplandigi icin cifte dusum olusmaz)
  doseme_kalibindan_mesnet_dus: true
  # Kolon/perde kalibinda kirislerin sapladigi yuzey dusulsun mu?
  kolon_kalibindan_kiris_dus: true
  # Kirisin kolon/perde icinde kalan boyu net acikliktan dusulur (kirik olcu)
  kiris_net_aciklik: true
  # Yuvarlama basamagi (rapor icin)
  yuvarlama: 3

# --- Yaklasik donati (demir) metraji -----------------------------------------
# Sistem betonarme donatı cizimini OKUMAZ; bu katsayilar klasik "beton basina
# demir" pratiğidir ve YAKLAŞIK değerdir. Aktifse her elemanin beton satirinin
# yanina "kg" satiri eklenir ve cetvelde Demir (kg) sutunu dolar.
donati:
  aktif: false
  # kg demir / m3 beton (ofis ortalamalarınızı girin)
  katsayilar:
    kolon: 110
    perde: 90
    kiris: 120
    doseme: 95
    merdiven: 70

# --- Poz numaralari ----------------------------------------------------------
# Kendi birim fiyat/poz sisteminize gore degistirin.
pozlar:
  kolon_beton: "16.058/1-K"
  kolon_kalip: "21.011/K"
  perde_beton: "16.058/1-P"
  perde_kalip: "21.011/P"
  kiris_beton: "16.058/1-Kr"
  kiris_kalip: "21.011/Kr"
  doseme_beton: "16.058/1-D"
  doseme_kalip: "21.011/D"
  merdiven_beton: "16.058/1-M"
  merdiven_kalip: "21.011/M"
  kapi: "22.201"
  pencere: "22.211"
  siva: "21.061"
  siva_tavan: "21.071"
  kaplama: "23.062/S"
  duvar: "21.121"
  duvar_siva: "21.061"
  # Yaklasik donati metraji icin tek poz (katsayi esasli)
  demir: "18.001"

# --- Yaklasik maliyet --------------------------------------------------------
# Metraj cetvelindeki poz miktarlari x birim fiyat ile yaklasik maliyet
# cikarilir (devlet ihale yaklasik maliyeti gibi). Fiyatlar ORNEKTIR;
# guncel bakanlik (Cevre, Sehircilik ve Iklim Degisikligi) veya il birim
# fiyatlarinizi girin. Arayuzde "Maliyet" sekmesinden de duzenlenebilir.
maliyet:
  aktif: false
  para_birimi: "TL"
  # Yerli islerde genellikle %20
  kdv_oran: 20
  # Yil bazli resmi birim fiyat veritabani (poz -> fiyat). Bu dosyadaki
  # poz_fiyatlari ustune biner (oncelik kullanici ayarindadir). Dosya
  # yoksa sessizce atlanir. Bicim:
  #   fiyatlar_yolu: birim_fiyatlar.yml
  #   -> "16.058/1-K": 4900
  fiyatlar_yolu: ""
  # Betonarme sinifina gore beton pozlarina ozel fiyat ezmeleri. Aktif sinif
  # `kat.beton_sinifi` ile secilir; secilen siniftaki fiyatlar genel
  # poz_fiyatlari'nin ustune biner. "16." on ekli beton pozlarina uygulanir.
  # Sadece sinif icin ayni m3 fiyati gecerse tek anahtar yeterli:
  #   beton_siniflari:
  #     C25/30:
  #       "16.058/1-K": 4200
  #       "16.058/1-D": 4300
  #     C30/37:
  #       "16.058/1-K": 4500
  #       "16.058/1-D": 4600
  beton_siniflari:
    C25/30: {}
    C30/37: {}
    C35/45: {}
  # Poz -> birim fiyat (TL). Poz numaralari ustteki pozlar ile eslesir.
  poz_fiyatlari:
    "16.058/1-K": 4200
    "21.011/K": 480
    "16.058/1-P": 4200
    "21.011/P": 480
    "16.058/1-Kr": 4300
    "21.011/Kr": 500
    "16.058/1-D": 4300
    "21.011/D": 500
    "16.058/1-M": 4600
    "21.011/M": 560
    "18.001": 55
    "22.201": 3000
    "22.211": 2200
    "21.061": 250
    "21.071": 210
    "23.062/S": 320
    "23.062/T": 90

# --- PDF'e ozel ayarlar ------------------------------------------------------
pdf:
  # Pafta olcegi. "1/50" veya sayisal 50. Kalibrasyon verilirse o oncelikli.
  olcek: "1/50"
  sayfa: 1
  # PDF'te katman yoktur; cizgi rengi/kalinligi ile eleman tipi eslenir.
  # Renkler "#RRGGBB" veya "siyah/kirmizi/mavi/yesil" olabilir.
  # Once `hakedis pdf-incele plan.pdf` calistirip gercek renkleri gorun.
  renk_esleme: {}
  # Ornek:
  # renk_esleme:
  #   "#ff0000": kolon
  #   "#0000ff": kiris
  #   "#00ff00": doseme
  # Cok ince cizgileri (tarama, olculendirme) at
  min_cizgi_kalinligi: 0.0
  # Sta4CAD kalip/temel planlarinda betonarme elemanlarin dolgusu kirmizi,
  # kiriscik/tarama yesil olarak yuzlerce kucuk parca seklinde cizilir. Bu
  # desen (kisa cizgi orani esiginin ustunde) algilanirsa dolgu renkleri
  # otomatik yoksayilir ve yalnizca buyuk kapali alanlar (doseme) metraja
  # girer. Kullanici bir rengi elle eslerse secimi korunur.
  sta4cad_otomatik: true
  sta4cad_kisa_cizgi_pt: 10.0
  sta4cad_kisa_cizgi_orani: 0.40
  sta4cad_renkler:
    - "#ff0000"
    - "#269900"
  # Donati (demir) isareti tasiyan etiket orani bu esigi asarsa paftanin
  # donati/kiris detay paftasi olabilecegine dair not dusulur.
  donati_etiket_orani: 0.10
  # Yazilari da oku
  metin_oku: true
  # Iki nokta kalibrasyonu (olcekten daha guvenilirdir; tanimliysa oncelikli).
  # Paftada boyu bilinen bir mesafeyi (ornegin bir aks araligini) PDF
  # puntosu cinsinden olcup gercek karsiligini yazin.
  # CLI karsiligi: --kalibre 340.5:6.00
  # kalibrasyon:
  #   pdf_mesafe: 340.5      # punto
  #   gercek_mesafe: 6.00    # metre
